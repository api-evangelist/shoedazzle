description: >-
  ShoeDazzle is a California-based online fashion subscription retailer offering
  curated shoes, handbags, and accessories through a VIP membership model.
  Founded in March 2009 (early backers included Andreessen Horowitz and
  Lightspeed Venture Partners), it was acquired by JustFab in August 2013 and is
  now operated as a brand of TechStyle Fashion Group alongside Fabletics,
  JustFab, FabKids, and Savage X Fenty. ShoeDazzle is a direct-to-consumer
  e-commerce brand; as of this enrichment pass it publishes no public developer
  API, developer portal, or machine-readable API documentation.
